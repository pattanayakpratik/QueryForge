[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "queryforge"
version = "0.1.0"
description = "Autonomous Text-to-SQL & Natural Language BI Engine with AST Firewall & Self-Healing Loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.35",
    "greenlet>=3.0.0",
    "asyncpg>=0.30.0",
    "aiosqlite>=0.20.0",
    "sqlglot>=25.26.0",
    "chromadb>=0.5.15",
    "httpx>=0.27.2",
    "pandas>=2.2.3",
    "python-dotenv>=1.0.1",
    "cryptography>=43.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "black>=24.8.0",
    "ruff>=0.7.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
